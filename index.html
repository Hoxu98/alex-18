<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Alex — 18. urodziny</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #090909;
      color: #fff;
      min-height: 100vh;
    }

    .wrap {
      width: 100%;
      padding: 20px;
    }

    .card {
      max-width: 1200px;
      margin: auto;
      background: #111;
      border: 1px solid #3a2d12;
      border-radius: 24px;
      padding: 30px 20px 50px;
      box-shadow: 0 0 40px rgba(217, 180, 90, 0.08);
    }

    .hero {
      text-align: center;
      padding: 20px 10px 35px;
    }

    .crown {
      font-size: 42px;
      color: #d9b45a;
      margin-bottom: 10px;
    }

    .small-title {
      color: #d9b45a;
      font-size: 15px;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: clamp(52px, 12vw, 110px);
      line-height: 0.9;
      color: #d9b45a;
      margin-bottom: 18px;
    }

    .subtitle {
      font-family: Georgia, serif;
      font-size: 25px;
      color: #fff;
      margin-bottom: 15px;
    }

    .date {
      color: #aaa;
      font-size: 15px;
      letter-spacing: 3px;
    }

    .gold-line {
      width: 90px;
      height: 2px;
      background: #d9b45a;
      margin: 25px auto;
    }

    .gallery-title {
      text-align: center;
      margin: 15px 0 25px;
    }

    .gallery-title h2 {
      color: #d9b45a;
      font-family: Georgia, serif;
      font-size: 30px;
      margin-bottom: 8px;
    }

    .gallery-title p {
      color: #aaa;
      font-size: 14px;
    }

    /* POBIERZ WSZYSTKO */

    .download-all {
      display: block;
      width: 100%;
      max-width: 500px;
      margin: 0 auto 12px;
      padding: 17px 20px;
      border: 1px solid #d9b45a;
      border-radius: 14px;
      background: linear-gradient(135deg, #d9b45a, #b9943d);
      color: #080808;
      text-align: center;
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.2s;
    }

    .download-all:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(217,180,90,0.2);
    }

    .download-info {
      text-align: center;
      color: #777;
      font-size: 12px;
      margin-bottom: 30px;
    }

    /* GALERIA */

    .gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .photo {
      position: relative;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #292929;
    }

    .photo img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      cursor: pointer;
      transition: transform 0.25s;
    }

    .photo:hover img {
      transform: scale(1.04);
    }

    .photo-download {
      display: block;
      text-align: center;
      background: #151515;
      color: #d9b45a;
      text-decoration: none;
      font-size: 12px;
      font-weight: bold;
      padding: 10px 5px;
      border-top: 1px solid #2c2c2c;
    }

    .photo-download:hover {
      background: #202020;
    }

    .loading,
    .empty {
      text-align: center;
      color: #888;
      padding: 50px 20px;
      grid-column: 1 / -1;
    }

    /* LIGHTBOX */

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.96);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .lightbox-image {
      max-width: 92vw;
      max-height: 78vh;
      object-fit: contain;
      border-radius: 8px;
    }

    .lightbox-counter {
      color: #aaa;
      font-size: 13px;
      margin: 10px 0;
    }

    .lightbox-download {
      display: inline-block;
      background: #d9b45a;
      color: #090909;
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: bold;
    }

    .lightbox-close,
    .lightbox-prev,
    .lightbox-next {
      border: 1px solid #555;
      background: #151515;
      color: #fff;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 20px;
      color: #d9b45a;
      font-size: 25px;
    }

    .lightbox-prev {
      position: absolute;
      left: 20px;
    }

    .lightbox-next {
      position: absolute;
      right: 20px;
    }

    .footer {
      text-align: center;
      color: #555;
      font-size: 12px;
      margin-top: 40px;
    }

    @media (max-width: 900px) {
      .gallery {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 600px) {
      .wrap {
        padding: 8px;
      }

      .card {
        border-radius: 16px;
        padding: 20px 10px 35px;
      }

      .hero {
        padding-top: 10px;
      }

      .gallery {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }

      .photo-download {
        font-size: 11px;
        padding: 9px 3px;
      }

      .lightbox-prev {
        left: 8px;
      }

      .lightbox-next {
        right: 8px;
      }

      .lightbox-image {
        max-width: 96vw;
        max-height: 72vh;
      }
    }
  </style>
</head>

<body>

<div class="wrap">
  <main class="card">

    <section class="hero">

      <div class="crown">♛</div>

      <div class="small-title">
        18. urodziny
      </div>

      <h1>Alex</h1>

      <div class="subtitle">
        Let's make memories.
      </div>

      <div class="gold-line"></div>

      <div class="date">
        26.09.2026
      </div>

    </section>


    <section class="gallery-title">

      <h2>WSPÓLNE WSPOMNIENIA</h2>

      <p>
        Zdjęcia z 18. urodzin Alexa 📸
      </p>

    </section>


    <!--
      ==================================================
      POBIERANIE CAŁEGO FOLDERU GOOGLE DRIVE
      ==================================================
    -->

    <a
      class="download-all"
      href="https://drive.google.com/drive/folders/1dtOKuykecCUBaxEH4P1vxb8iljJfP5yG?download=1"
      target="_blank"
      rel="noopener">

      📦 POBIERZ WSZYSTKIE ZDJĘCIA

    </a>

    <div class="download-info">
      Pobierz całą galerię z Google Drive
    </div>


    <!-- GALERIA -->

    <section>

      <div
        id="gallery"
        class="gallery">

        <div class="loading">
          Ładowanie galerii…
        </div>

      </div>

    </section>


    <div class="footer">
      Alex • 18. urodziny • 26.09.2026
    </div>

  </main>
</div>


<!-- LIGHTBOX -->

<div
  id="lightbox"
  class="lightbox">

  <button
    id="lightboxClose"
    class="lightbox-close"
    type="button">
    ×
  </button>

  <button
    id="lightboxPrev"
    class="lightbox-prev"
    type="button">
    ‹
  </button>

  <div class="lightbox-content">

    <img
      id="lightboxImage"
      class="lightbox-image"
      src=""
      alt="Zdjęcie">

    <div
      id="lightboxCounter"
      class="lightbox-counter">
      1 / 1
    </div>

    <a
      id="lightboxDownload"
      class="lightbox-download"
      href="#"
      target="_blank"
      rel="noopener">

      ⬇ POBIERZ ZDJĘCIE

    </a>

  </div>

  <button
    id="lightboxNext"
    class="lightbox-next"
    type="button">
    ›
  </button>

</div>


<script>

  /*
  =====================================================
  TWÓJ GOOGLE APPS SCRIPT
  =====================================================

  Wklej tutaj TEN SAM adres Web App,
  którego używała wcześniejsza wersja strony.
  */

  const WEB_APP_URL =
    https://script.google.com/macros/s/AKfycbxHbh3NOYIV00cJ8GNy_unOXHp3IKCTYbJF5Gyh-1O1W6VU7V0AJhZ1bF901UOJrMdJ/exec;


  let photos = [];

  let currentPhoto = 0;


  const gallery =
    document.getElementById("gallery");

  const lightbox =
    document.getElementById("lightbox");

  const lightboxImage =
    document.getElementById("lightboxImage");

  const lightboxDownload =
    document.getElementById("lightboxDownload");

  const lightboxCounter =
    document.getElementById("lightboxCounter");


  /*
  =====================================================
  WCZYTANIE GALERII
  =====================================================
  */

  function loadGallery() {

    if (
      !WEB_APP_URL ||
      WEB_APP_URL.includes("TU_WKLEJ")
    ) {

      gallery.innerHTML = `
        <div class="empty">
          Nie ustawiono adresu Google Apps Script.
        </div>
      `;

      return;
    }


    const script =
      document.createElement("script");


    script.src =
      WEB_APP_URL +
      "?callback=galleryCallback&t=" +
      Date.now();


    document.body.appendChild(script);

  }


  /*
  =====================================================
  CALLBACK Z GOOGLE APPS SCRIPT
  =====================================================
  */

  function galleryCallback(data) {

    if (!Array.isArray(data)) {

      gallery.innerHTML = `
        <div class="empty">
          Nie udało się wczytać galerii.
        </div>
      `;

      return;
    }


    /*
      Najnowsze zdjęcia będą pierwsze.
    */

    photos =
      data.reverse();


    gallery.innerHTML = "";


    if (photos.length === 0) {

      gallery.innerHTML = `
        <div class="empty">
          Galeria jest jeszcze pusta.
        </div>
      `;

      return;
    }


    photos.forEach(
      function(photo, index) {

        const item =
          document.createElement("div");

        item.className =
          "photo";


        const image =
          document.createElement("img");

        image.src =
          photo.url;

        image.alt =
          "Zdjęcie " + (index + 1);

        image.loading =
          "lazy";


        image.addEventListener(
          "click",
          function() {
            openLightbox(index);
          }
        );


        const download =
          document.createElement("a");

        download.className =
          "photo-download";

        download.href =
          photo.download;

        download.target =
          "_blank";

        download.rel =
          "noopener";

        download.textContent =
          "⬇ POBIERZ";


        item.appendChild(image);

        item.appendChild(download);

        gallery.appendChild(item);

      }
    );

  }


  /*
  =====================================================
  LIGHTBOX
  =====================================================
  */

  function openLightbox(index) {

    if (!photos.length) {
      return;
    }


    currentPhoto =
      index;


    updateLightbox();


    lightbox.classList.add("active");


    document.body.style.overflow =
      "hidden";

  }


  function closeLightbox() {

    lightbox.classList.remove("active");

    document.body.style.overflow =
      "";

  }


  function updateLightbox() {

    if (!photos.length) {
      return;
    }


    const photo =
      photos[currentPhoto];


    lightboxImage.src =
      photo.url;


    lightboxDownload.href =
      photo.download;


    lightboxCounter.textContent =
      (currentPhoto + 1) +
      " / " +
      photos.length;

  }


  function nextPhoto() {

    if (!photos.length) {
      return;
    }


    currentPhoto =
      (currentPhoto + 1) %
      photos.length;


    updateLightbox();

  }


  function previousPhoto() {

    if (!photos.length) {
      return;
    }


    currentPhoto =
      (currentPhoto - 1 + photos.length) %
      photos.length;


    updateLightbox();

  }


  document
    .getElementById("lightboxClose")
    .addEventListener(
      "click",
      closeLightbox
    );


  document
    .getElementById("lightboxNext")
    .addEventListener(
      "click",
      nextPhoto
    );


  document
    .getElementById("lightboxPrev")
    .addEventListener(
      "click",
      previousPhoto
    );


  /*
  =====================================================
  KLIKNIĘCIE POZA ZDJĘCIEM = ZAMKNIĘCIE
  =====================================================
  */

  lightbox.addEventListener(
    "click",
    function(event) {

      if (
        event.target === lightbox
      ) {
        closeLightbox();
      }

    }
  );


  /*
  =====================================================
  KLAWIATURA
  =====================================================
  */

  document.addEventListener(
    "keydown",
    function(event) {

      if (
        !lightbox.classList.contains("active")
      ) {
        return;
      }


      if (event.key === "Escape") {
        closeLightbox();
      }


      if (event.key === "ArrowRight") {
        nextPhoto();
      }


      if (event.key === "ArrowLeft") {
        previousPhoto();
      }

    }
  );


  /*
  =====================================================
  SWIPE NA TELEFONIE
  =====================================================
  */

  let touchStartX = 0;

  let touchEndX = 0;


  lightbox.addEventListener(
    "touchstart",
    function(event) {

      touchStartX =
        event.changedTouches[0].screenX;

    },
    {
      passive: true
    }
  );


  lightbox.addEventListener(
    "touchend",
    function(event) {

      touchEndX =
        event.changedTouches[0].screenX;


      const distance =
        touchEndX - touchStartX;


      if (
        Math.abs(distance) < 50
      ) {
        return;
      }


      if (distance < 0) {
        nextPhoto();
      } else {
        previousPhoto();
      }

    },
    {
      passive: true
    }
  );


  /*
  =====================================================
  START
  =====================================================
  */

  loadGallery();

</script>

</body>
</html>
