<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alex — 18 urodziny</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:#090909;color:#f5f1e8;font-family:Arial,Helvetica,sans-serif}
.wrap{min-height:100vh;display:flex;justify-content:center;padding:25px}
.card{width:min(430px,100%);text-align:center;padding:45px 25px;border:1px solid #9c7a2b;border-radius:24px;background:radial-gradient(circle at top,rgba(180,140,50,.12),transparent 40%),linear-gradient(145deg,#151515,#080808);box-shadow:0 0 50px rgba(190,150,50,.15)}
.crown{font-size:42px}.small{letter-spacing:5px;text-transform:uppercase;font-size:12px;color:#c9a34d}
h1{font-family:Georgia,serif;font-size:64px;line-height:.95;margin:12px 0;color:#d9b45a}h2{font-family:Georgia,serif;font-weight:400;font-size:25px;margin:0 0 18px}.date{color:#d7d0c3;margin-bottom:35px}
.download-all{display:block;width:100%;padding:16px;border-radius:14px;border:1px solid #b9943d;background:linear-gradient(90deg,#17130b,#2a2110,#17130b);color:#e0bd61;font-size:15px;font-weight:bold;cursor:pointer;text-decoration:none}
.download-info{font-size:11px;color:#827a6b;margin-top:9px;min-height:16px}
.gallery-section{margin-top:45px;padding-top:35px;border-top:1px solid #5d4920}.gallery-title span{font-size:10px;letter-spacing:4px;color:#b8943e}.gallery-title h3{font-family:Georgia,serif;font-size:29px;font-weight:normal;color:#d9b45a;margin:8px 0 25px}
.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.tile{overflow:hidden;border-radius:10px;border:1px solid #3d321d;background:#111}.gallery img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;cursor:pointer}.photo-download{display:block;text-decoration:none;text-align:center;padding:9px 5px;background:#111;color:#d9b45a;font-size:11px;font-weight:bold}.gallery-loading{grid-column:1/-1;color:#8f8a80;font-size:13px;padding:20px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.97);z-index:9999;display:none;align-items:center;justify-content:center;padding:55px 20px 70px}.lightbox.active{display:flex}.lightbox-image{max-width:100%;max-height:82vh;object-fit:contain;border-radius:8px}.close,.nav{position:absolute;border-radius:50%;border:1px solid #80652c;background:rgba(10,10,10,.9);color:#d9b45a;cursor:pointer;z-index:10}.close{top:15px;right:20px;width:45px;height:45px;font-size:28px}.nav{top:50%;transform:translateY(-50%);width:45px;height:45px;font-size:25px}.prev{left:15px}.next{right:15px}.counter{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);color:#d9b45a;font-size:13px;letter-spacing:2px}
@media(max-width:600px){.lightbox-image{max-height:78vh}.nav{width:40px;height:40px}.prev{left:8px}.next{right:8px}}
</style>
</head>
<body>
<div class="wrap"><main class="card">
<div class="crown">♛</div><div class="small">18. urodziny</div><h1>Alex</h1><h2>Let's make memories.</h2><div class="date">26.09.2026</div>
<a id="downloadAll" class="download-all" href="#">📦 POBIERZ CAŁĄ GALERIĘ</a>
<div id="downloadInfo" class="download-info">Przygotuj paczkę wszystkich zdjęć…</div>
<section class="gallery-section"><div class="gallery-title"><span>WSPÓLNE WSPOMNIENIA</span><h3>Galeria 📸</h3></div><div id="gallery" class="gallery"><div class="gallery-loading">Ładowanie zdjęć...</div></div></section>
</main></div>
<div id="lightbox" class="lightbox"><button class="close" id="close">×</button><button class="nav prev" id="prev">‹</button><img id="lightboxImage" class="lightbox-image" alt=""><button class="nav next" id="next">›</button><div id="counter" class="counter"></div></div>
<script>
const WEB_APP_URL="https://script.google.com/macros/s/AKfycbxHbh3NOYIV00cJ8GNy_unOXHp3IKCTYbJF5Gyh-1O1W6VU7V0AJhZ1bF901UOJrMdJ/exec";
let photos=[],currentPhoto=0;
const gallery=document.getElementById("gallery"),downloadAll=document.getElementById("downloadAll"),downloadInfo=document.getElementById("downloadInfo");

function loadGallery(){const s=document.createElement("script");s.src=WEB_APP_URL+"?callback=galleryCallback&t="+Date.now();document.body.appendChild(s)}
function galleryCallback(data){
 photos=Array.isArray(data)?data.reverse():[];gallery.innerHTML="";
 if(!photos.length){gallery.innerHTML='<div class="gallery-loading">Nie ma jeszcze zdjęć.</div>';downloadInfo.textContent="Brak zdjęć w galerii.";return}
 downloadInfo.textContent=photos.length+(photos.length===1?" zdjęcie":" zdjęć")+" w galerii.";
 photos.forEach((photo,index)=>{const tile=document.createElement("div");tile.className="tile";const img=document.createElement("img");img.src=photo.url;img.alt="Zdjęcie z 18. urodzin Alexa";img.loading="lazy";img.onclick=()=>openLightbox(index);const a=document.createElement("a");a.className="photo-download";a.href=photo.download;a.target="_blank";a.rel="noopener";a.textContent="⬇ POBIERZ ZDJĘCIE";tile.append(img,a);gallery.appendChild(tile)})
}
async function prepareZip(){
 downloadAll.textContent="⏳ PRZYGOTOWUJĘ PACZKĘ…";downloadAll.style.pointerEvents="none";downloadInfo.textContent="Tworzenie pliku ZIP może chwilę potrwać.";
 try{const r=await fetch(WEB_APP_URL+"?action=zip&t="+Date.now());const x=await r.json();if(!x.success)throw Error(x.error||"Błąd");downloadAll.href=x.url;downloadAll.target="_blank";downloadAll.textContent="📦 POBIERZ CAŁĄ GALERIĘ";downloadAll.style.pointerEvents="auto";downloadInfo.textContent=x.count+(x.count===1?" zdjęcie gotowe do pobrania.":" zdjęć gotowych do pobrania.")}catch(e){console.error(e);downloadAll.removeAttribute("href");downloadAll.textContent="↻ SPRÓBUJ PONOWNIE";downloadAll.style.pointerEvents="auto";downloadInfo.textContent="Nie udało się przygotować paczki."}
}
downloadAll.onclick=e=>{if(!downloadAll.href||downloadAll.href.endsWith("#")){e.preventDefault();prepareZip()}};

const lightbox=document.getElementById("lightbox"),lightboxImage=document.getElementById("lightboxImage"),counter=document.getElementById("counter");
function openLightbox(i){if(!photos.length)return;currentPhoto=i;updateLightbox();lightbox.classList.add("active");document.body.style.overflow="hidden"}
function closeLightbox(){lightbox.classList.remove("active");document.body.style.overflow=""}
function updateLightbox(){lightboxImage.src=photos[currentPhoto].url;counter.textContent=(currentPhoto+1)+" / "+photos.length}
function nextPhoto(){currentPhoto=(currentPhoto+1)%photos.length;updateLightbox()}
function previousPhoto(){currentPhoto=(currentPhoto-1+photos.length)%photos.length;updateLightbox()}
document.getElementById("close").onclick=closeLightbox;document.getElementById("next").onclick=nextPhoto;document.getElementById("prev").onclick=previousPhoto;
lightbox.onclick=e=>{if(e.target===lightbox)closeLightbox()};
document.onkeydown=e=>{if(!lightbox.classList.contains("active"))return;if(e.key==="Escape")closeLightbox();if(e.key==="ArrowRight")nextPhoto();if(e.key==="ArrowLeft")previousPhoto()};
let touchStartX=0;lightbox.ontouchstart=e=>touchStartX=e.changedTouches[0].screenX;lightbox.ontouchend=e=>{const d=touchStartX-e.changedTouches[0].screenX;if(Math.abs(d)>=50)d>0?nextPhoto():previousPhoto()};
loadGallery();
</script>
</body>
</html>
